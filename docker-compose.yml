services:
  postgres:
    image: postgres:16-alpine
    container_name: notenflow-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-notenflow}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-notenflow_secret_db_pw}
      POSTGRES_DB: ${POSTGRES_DB:-notenflow}
    ports:
      - "${POSTGRES_PORT:-5435}:5432"
    volumes:
      - notenflow_pgdata:/var/lib/postgresql/data
      - ./migrations/001_initial_schema.sql:/docker-entrypoint-initdb.d/001_initial_schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-notenflow} -d ${POSTGRES_DB:-notenflow}"]
      interval: 5s
      timeout: 5s
      retries: 10

  server:
    build:
      context: .
      dockerfile: Dockerfile
      target: server-runtime
    container_name: notenflow-server
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-notenflow}:${POSTGRES_PASSWORD:-notenflow_secret_db_pw}@postgres:5432/${POSTGRES_DB:-notenflow}
      JWT_SECRET: ${JWT_SECRET:-super_secret_jwt_signing_key_change_in_prod_32b}
      SERVER_ENCRYPTION_KEY: ${SERVER_ENCRYPTION_KEY:-0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef}
      RUST_LOG: info
      PORT: 8080
    volumes:
      - notenflow_vaultdata:/app/data
    ports:
      - "${API_PORT:-8080}:8080"

  web:
    build:
      context: .
      dockerfile: Dockerfile
      target: web-runtime
    container_name: notenflow-web
    restart: unless-stopped
    depends_on:
      - server
    ports:
      - "${WEB_PORT:-3080}:80"

volumes:
  notenflow_pgdata:
  notenflow_vaultdata:

