services:
  postgres:
    image: postgres:16-alpine
    container_name: gradus21-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-gradus21}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-gradus21_secret_db_pw}
      POSTGRES_DB: ${POSTGRES_DB:-gradus21}
    ports:
      - "${POSTGRES_PORT:-5435}:5432"
    volumes:
      - gradus21_pgdata:/var/lib/postgresql/data
      - ./migrations:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-gradus21} -d ${POSTGRES_DB:-gradus21}"]
      interval: 5s
      timeout: 5s
      retries: 10

  server:
    image: ghcr.io/gradus21/gradus21-server:${IMAGE_TAG:-latest}
    build:
      context: .
      dockerfile: Dockerfile
      target: server-runtime
    container_name: gradus21-server
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-gradus21}:${POSTGRES_PASSWORD:-gradus21_secret_db_pw}@postgres:5432/${POSTGRES_DB:-gradus21}
      JWT_SECRET: ${JWT_SECRET:-super_secret_jwt_signing_key_change_in_prod_32b}
      SERVER_ENCRYPTION_KEY: ${SERVER_ENCRYPTION_KEY:-0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef}
      WEBAUTHN_RP_ID: ${WEBAUTHN_RP_ID:-gradus21.app}
      WEBAUTHN_RP_NAME: ${WEBAUTHN_RP_NAME:-Gradus21}
      WEBAUTHN_RP_ORIGIN: ${WEBAUTHN_RP_ORIGIN:-https://gradus21.app}
      WEBAUTHN_ALLOWED_ORIGINS: ${WEBAUTHN_ALLOWED_ORIGINS:-https://gradus21.app}
      CORS_ALLOWED_ORIGIN: ${CORS_ALLOWED_ORIGIN:-http://localhost:3080,http://localhost:5173}
      RUST_LOG: info
      PORT: 8080
      APP_ENV: ${APP_ENV:-production}
      # Rechtliche Angaben (§ 5 DDG Impressum & DSGVO Konfiguration)
      LEGAL_IMPRESSUM_NAME: ${LEGAL_IMPRESSUM_NAME:-Julian Kallidat}
      LEGAL_IMPRESSUM_COMPANY: ${LEGAL_IMPRESSUM_COMPANY:-}
      LEGAL_IMPRESSUM_ADDRESS: ${LEGAL_IMPRESSUM_ADDRESS:-Hardtstr. 6, 76467 Bietigheim, Deutschland}
      LEGAL_IMPRESSUM_EMAIL: ${LEGAL_IMPRESSUM_EMAIL:-kontakt@gradus21.de}
      LEGAL_IMPRESSUM_PHONE: ${LEGAL_IMPRESSUM_PHONE:-}
      LEGAL_IMPRESSUM_REPRESENTATIVE: ${LEGAL_IMPRESSUM_REPRESENTATIVE:-}
      LEGAL_IMPRESSUM_REGISTER: ${LEGAL_IMPRESSUM_REGISTER:-}
      LEGAL_IMPRESSUM_VAT_ID: ${LEGAL_IMPRESSUM_VAT_ID:-}
      LEGAL_HOSTING_PROVIDER: ${LEGAL_HOSTING_PROVIDER:-Hetzner Online GmbH (Deutschland)}
      LEGAL_HOSTING_LOCATION: ${LEGAL_HOSTING_LOCATION:-Falkenstein / Nürnberg, Deutschland (EU)}
      LEGAL_DPO_CONTACT: ${LEGAL_DPO_CONTACT:-}
      # AVV (Auftragsverarbeitungsvertrag gem. Art. 28 DSGVO) Konfiguration
      LEGAL_AVV_URL: ${LEGAL_AVV_URL:-https://gradus21.de/avv.html}
      LEGAL_AVV_DOWNLOAD_URL: ${LEGAL_AVV_DOWNLOAD_URL:-https://gradus21.de/downloads/gradus21-muster-avv.pdf}
      LEGAL_AVV_CUSTOM_TEXT: ${LEGAL_AVV_CUSTOM_TEXT:-}
      # Nutzungsbedingungen (Terms of Service)
      LEGAL_TERMS_URL: ${LEGAL_TERMS_URL:-https://gradus21.de/nutzungsbedingungen.html}
    volumes:
      - gradus21_vaultdata:/app/data
    ports:
      - "${API_PORT:-8080}:8080"

  web:
    image: ghcr.io/gradus21/gradus21-web:${IMAGE_TAG:-latest}
    build:
      context: .
      dockerfile: Dockerfile
      target: web-runtime
    container_name: gradus21-web
    restart: unless-stopped
    depends_on:
      - server
    ports:
      - "${WEB_PORT:-3080}:80"

volumes:
  gradus21_pgdata:
  gradus21_vaultdata:

