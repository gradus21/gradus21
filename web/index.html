<!doctype html>
<html lang="de">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/gradus21-app-icon.svg" />
    <link rel="manifest" href="/manifest.json" />
    <meta name="theme-color" content="#0d9488" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Gradus21" />
    <title>Gradus21 — Sichere Notenverwaltung & Didaktik</title>
    <!-- Self-hosted Fonts (DSGVO / DSGVO-konform ohne Google US-Server-Verbindung) -->
    <link rel="stylesheet" href="/fonts/fonts.css" />
    <script>
      (function () {
        try {
          var raw = localStorage.getItem('gradus21_theme_preference');
          var pref = raw ? JSON.parse(raw) : null;
          var mode = pref ? pref.themeMode || (pref.darkMode ? 'dark' : 'light') : 'system';
          var isDark =
            mode === 'dark' ||
            (mode === 'system' &&
              window.matchMedia &&
              window.matchMedia('(prefers-color-scheme: dark)').matches);
          var metaTheme = document.querySelector('meta[name="theme-color"]');
          if (isDark) {
            document.documentElement.classList.add('dark');
            if (metaTheme) metaTheme.setAttribute('content', '#121b20');
          } else {
            document.documentElement.classList.remove('dark');
            if (metaTheme) metaTheme.setAttribute('content', '#0d9488');
          }
          if (pref && pref.themePreset) {
            document.documentElement.setAttribute('data-theme', pref.themePreset);
          }
        } catch (e) {}
      })();
    </script>
  </head>
  <body class="antialiased selection:bg-teal-500/20 selection:text-teal-700">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
