name: Apple Multiplatform Release (iOS, iPadOS & macOS)

on:
  push:
    branches:
      - dev
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      upload_testflight:
        description: 'Upload build directly to TestFlight'
        required: true
        type: boolean
        default: true

permissions:
  contents: write

jobs:
  build-apple:
    name: Build & Package Apple Apps
    runs-on: macos-26
    timeout-minutes: 60

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown, aarch64-apple-darwin, x86_64-apple-darwin

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2

      - name: Install wasm-pack
        run: curl https://rustwasm.github.io/wasm-pack/installer/init.sh -sSf | sh

      - name: Build Core WASM
        run: wasm-pack build crates/gradus21-core --target web --out-dir ../../web/src/wasm-pkg

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install Frontend Dependencies
        working-directory: web
        run: npm ci

      - name: Build Standalone Frontend Client
        working-directory: web
        env:
          VITE_STANDALONE_CLIENT: 'true'
        run: npm run build

      - name: Install Apple Keychain & Certificates
        env:
          APPLE_CERTIFICATE_P12: ${{ secrets.APPLE_CERTIFICATE_P12 }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_INSTALLER_CERTIFICATE_P12: ${{ secrets.APPLE_INSTALLER_CERTIFICATE_P12 }}
          APPLE_INSTALLER_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_INSTALLER_CERTIFICATE_PASSWORD }}
        run: |
          if [ -z "$APPLE_CERTIFICATE_P12" ]; then
            echo "Notice: APPLE_CERTIFICATE_P12 secret not configured. Skipping keychain import."
            exit 0
          fi
          KEYCHAIN_PATH=$RUNNER_TEMP/build.keychain
          KEYCHAIN_PASSWORD=$(uuidgen)
          
          # Create and configure temporary build keychain
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          
          # Import primary distribution p12 certificate
          CERT_FILE=$RUNNER_TEMP/cert.p12
          echo "$APPLE_CERTIFICATE_P12" | base64 --decode > "$CERT_FILE"
          security import "$CERT_FILE" -k "$KEYCHAIN_PATH" -P "$APPLE_CERTIFICATE_PASSWORD" -T /usr/bin/codesign -T /usr/bin/productbuild
          
          # Import Mac Installer Distribution p12 certificate (if configured)
          if [ -n "$APPLE_INSTALLER_CERTIFICATE_P12" ]; then
            INSTALLER_CERT_FILE=$RUNNER_TEMP/installer_cert.p12
            echo "$APPLE_INSTALLER_CERTIFICATE_P12" | base64 --decode > "$INSTALLER_CERT_FILE"
            security import "$INSTALLER_CERT_FILE" -k "$KEYCHAIN_PATH" -P "${APPLE_INSTALLER_CERTIFICATE_PASSWORD:-$APPLE_CERTIFICATE_PASSWORD}" -T /usr/bin/codesign -T /usr/bin/productbuild
          fi

          security set-key-partition-list -S apple-tool:,apple:,codesign:,productbuild: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          
          # Add to keychain search list
          security list-keychains -d user -s "$KEYCHAIN_PATH" $(security list-keychains -d user | tr -d '"')

      - name: Prepare macOS signing & notarization
        env:
          APP_STORE_CONNECT_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          APP_STORE_CONNECT_API_KEY_P8: ${{ secrets.APP_STORE_CONNECT_API_KEY_KEY }}
        run: |
          # DMG distribution outside the App Store needs a "Developer ID Application" cert.
          IDENTITY=$(security find-identity -v -p codesigning "$RUNNER_TEMP/build.keychain" 2>/dev/null \
            | grep "Developer ID Application" | head -n 1 | sed -E 's/.*"(.*)".*/\1/')
          if [ -z "$IDENTITY" ]; then
            echo "::notice::No 'Developer ID Application' certificate in keychain - building UNSIGNED macOS DMG."
            exit 0
          fi
          echo "APPLE_SIGNING_IDENTITY=$IDENTITY" >> "$GITHUB_ENV"
          echo "Signing with: $IDENTITY"
          if [ -n "$APP_STORE_CONNECT_API_KEY_P8" ]; then
            KEY_PATH="$RUNNER_TEMP/AuthKey_${APP_STORE_CONNECT_KEY_ID}.p8"
            echo "$APP_STORE_CONNECT_API_KEY_P8" > "$KEY_PATH"
            {
              echo "APPLE_API_ISSUER=$APP_STORE_CONNECT_ISSUER_ID"
              echo "APPLE_API_KEY=$APP_STORE_CONNECT_KEY_ID"
              echo "APPLE_API_KEY_PATH=$KEY_PATH"
            } >> "$GITHUB_ENV"
            echo "Notarization enabled."
          fi

      - name: Build macOS DMG & App Bundle
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          # Run from repo root so src-tauri/tauri.conf.json is found automatically.
          # Frontend was already built above, so override beforeBuildCommand to skip it.
          TAURI="./web/node_modules/.bin/tauri"
          OVERRIDE='{"build":{"beforeBuildCommand":""}}'
          $TAURI build --config "$OVERRIDE" --target universal-apple-darwin \
            || $TAURI build --config "$OVERRIDE" --target aarch64-apple-darwin

      - name: Upload macOS Artifacts
        uses: actions/upload-artifact@v6
        with:
          name: gradus21-macos-bundle
          path: |
            target/**/bundle/dmg/*.dmg*
            target/**/bundle/macos/*.tar.gz*
          if-no-files-found: warn

      - name: Attach macOS DMG to GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          dmg_files=$(find target -name "*.dmg" -type f)
          tar_files=$(find target -name "*.tar.gz*" -type f)
          if [ -n "$dmg_files" ] || [ -n "$tar_files" ]; then
            echo "Uploading macOS artifacts to release ${{ github.ref_name }}..."
            gh release upload "${{ github.ref_name }}" $dmg_files $tar_files --clobber || true
          fi
          node scripts/update-updater-manifest.mjs "${{ github.ref_name }}" macos || true

      - name: Package & Upload Mac App Store (.pkg)
        if: ${{ github.event_name == 'push' || inputs.upload_testflight }}
        env:
          KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          API_KEY_P8: ${{ secrets.APP_STORE_CONNECT_API_KEY_KEY }}
          APPLE_MAC_PROVISIONING_PROFILE: ${{ secrets.APPLE_MAC_PROVISIONING_PROFILE }}
        run: |
          if [ -z "$KEY_ID" ] || [ -z "$API_KEY_P8" ]; then
            echo "::notice::App Store Connect API key not configured. Skipping Mac App Store upload."
            exit 0
          fi

          # Find Apple Distribution certificate in keychain
          DIST_IDENTITY=$(security find-identity -v -p codesigning "$RUNNER_TEMP/build.keychain" 2>/dev/null \
            | grep "Apple Distribution" | head -n 1 | sed -E 's/.*"(.*)".*/\1/')
          if [ -z "$DIST_IDENTITY" ]; then
            DIST_IDENTITY=$(security find-identity -v -p codesigning "$RUNNER_TEMP/build.keychain" 2>/dev/null \
              | grep -E "(3rd Party Mac Developer Application|Apple Development)" | head -n 1 | sed -E 's/.*"(.*)".*/\1/')
          fi

          # Find Mac Installer Distribution certificate in keychain
          INSTALLER_IDENTITY=$(security find-identity -v "$RUNNER_TEMP/build.keychain" 2>/dev/null \
            | grep -E "(3rd Party Mac Developer Installer|Mac Installer Distribution)" | head -n 1 | sed -E 's/.*"(.*)".*/\1/')

          echo "App Signing Identity: ${DIST_IDENTITY:-NONE}"
          echo "Installer Signing Identity: ${INSTALLER_IDENTITY:-NONE}"

          # Locate built .app bundle
          APP_PATH=$(find target -name "Gradus21.app" -type d | head -n 1)
          if [ -z "$APP_PATH" ]; then
            echo "Error: Gradus21.app not found in target directory!"
            exit 1
          fi
          echo "Using app bundle: $APP_PATH"

          # Prepare dedicated MAS app bundle directory
          MAS_APP_DIR="$RUNNER_TEMP/mas/Gradus21.app"
          mkdir -p "$(dirname "$MAS_APP_DIR")"
          rm -rf "$MAS_APP_DIR"
          cp -R "$APP_PATH" "$MAS_APP_DIR"

          # Embed CFBundleVersion = GITHUB_RUN_NUMBER and ITSAppUsesNonExemptEncryption = false
          PLIST="$MAS_APP_DIR/Contents/Info.plist"
          if [ -f "$PLIST" ]; then
            /usr/libexec/PlistBuddy -c "Set :CFBundleVersion $GITHUB_RUN_NUMBER" "$PLIST" 2>/dev/null || \
            /usr/libexec/PlistBuddy -c "Add :CFBundleVersion string $GITHUB_RUN_NUMBER" "$PLIST" 2>/dev/null || true
            /usr/libexec/PlistBuddy -c "Add :ITSAppUsesNonExemptEncryption bool false" "$PLIST" 2>/dev/null || \
            /usr/libexec/PlistBuddy -c "Set :ITSAppUsesNonExemptEncryption false" "$PLIST" 2>/dev/null || true
          fi

          # Embed Provisioning Profile for Mac App Store
          VALID_MAC_PROFILE=false
          if [ -n "$APPLE_MAC_PROVISIONING_PROFILE" ]; then
            echo "$APPLE_MAC_PROVISIONING_PROFILE" | base64 --decode > "$MAS_APP_DIR/Contents/embedded.provisionprofile"
            if grep -q "<string>OSX</string>" "$MAS_APP_DIR/Contents/embedded.provisionprofile" 2>/dev/null || grep -q "<string>Mac</string>" "$MAS_APP_DIR/Contents/embedded.provisionprofile" 2>/dev/null; then
              echo "Valid macOS provisioning profile found in secrets."
              VALID_MAC_PROFILE=true
            else
              echo "Notice: Configured profile in secrets is for iOS/visionOS. Will attempt automated fetch via fastlane sigh."
              rm -f "$MAS_APP_DIR/Contents/embedded.provisionprofile"
            fi
          fi

          if [ "$VALID_MAC_PROFILE" = "false" ]; then
            echo "Attempting to auto-generate or download native macOS profile via fastlane sigh..."
            gem install fastlane --no-document --quiet || true
            ruby -r fastlane -e '
              begin
                key = Fastlane::Actions::AppStoreConnectApiKeyAction.run(
                  key_id: ENV["KEY_ID"],
                  issuer_id: ENV["ISSUER_ID"],
                  key_content: ENV["API_KEY_P8"]
                )
                Fastlane::Actions::SighAction.run(
                  api_key: key,
                  platform: "macos",
                  app_identifier: "de.gradus21.app",
                  type: "appstore",
                  output_path: ENV["RUNNER_TEMP"],
                  filename: "embedded.provisionprofile",
                  skip_install: true
                )
              rescue => e
                puts "Fastlane sigh warning: #{e.message}"
              end
            ' || true

            if [ -f "$RUNNER_TEMP/embedded.provisionprofile" ]; then
              cp "$RUNNER_TEMP/embedded.provisionprofile" "$MAS_APP_DIR/Contents/embedded.provisionprofile"
              echo "Successfully embedded freshly fetched macOS profile!"
              VALID_MAC_PROFILE=true
            fi
          fi

          # Re-sign app bundle for Mac App Store with Sandbox Entitlements
          if [ -n "$DIST_IDENTITY" ]; then
            echo "Codesigning MAS bundle with $DIST_IDENTITY..."
            codesign --keychain "$RUNNER_TEMP/build.keychain" --deep --force --options runtime \
              --entitlements src-tauri/Entitlements.mas.plist \
              --sign "$DIST_IDENTITY" \
              "$MAS_APP_DIR"
          fi

          # Package as .pkg with productbuild
          PKG_PATH="$RUNNER_TEMP/Gradus21-macOS.pkg"
          if [ -n "$INSTALLER_IDENTITY" ]; then
            echo "Building signed .pkg with $INSTALLER_IDENTITY..."
            productbuild --keychain "$RUNNER_TEMP/build.keychain" \
              --component "$MAS_APP_DIR" /Applications \
              --sign "$INSTALLER_IDENTITY" \
              "$PKG_PATH"
          else
            echo "::notice::No Mac Installer Distribution certificate found in keychain. Attempting unsigned package build..."
            productbuild --component "$MAS_APP_DIR" /Applications "$PKG_PATH"
          fi

          # Upload to App Store Connect
          if [ -f "$PKG_PATH" ]; then
            mkdir -p ~/.appstoreconnect/private_keys
            echo "$API_KEY_P8" > ~/.appstoreconnect/private_keys/AuthKey_${KEY_ID}.p8
            echo "Uploading $PKG_PATH to App Store Connect (platform osx)..."
            xcrun altool --upload-package "$PKG_PATH" \
              --type macos \
              --apiKey "$KEY_ID" \
              --apiIssuer "$ISSUER_ID" || echo "::warning::Mac App Store package upload encountered an error. Check certificate and profile requirements."
            rm -rf ~/.appstoreconnect/private_keys
            mkdir -p target
            cp "$PKG_PATH" target/Gradus21-macOS.pkg 2>/dev/null || true
          fi

      - name: Upload Mac App Store PKG artifact
        uses: actions/upload-artifact@v6
        with:
          name: gradus21-macos-mas-pkg
          path: target/Gradus21-macOS.pkg
          if-no-files-found: warn


  build-ios:
    name: Build iOS/iPadOS IPA & upload to TestFlight
    # Newer Xcode needed: xcodegen emits project format 77 and App Store requires a current iOS SDK.
    runs-on: macos-26
    timeout-minutes: 60
    if: ${{ github.event_name == 'push' || inputs.upload_testflight }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown, aarch64-apple-ios

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2

      - name: Install wasm-pack & xcodegen
        run: |
          curl https://rustwasm.github.io/wasm-pack/installer/init.sh -sSf | sh
          brew install xcodegen

      - name: Build Core WASM
        run: wasm-pack build crates/gradus21-core --target web --out-dir ../../web/src/wasm-pkg

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install Frontend Dependencies & build standalone client
        working-directory: web
        env:
          VITE_STANDALONE_CLIENT: 'true'
        run: |
          npm ci
          npm run build

      # Use the cargo-installed CLI: Xcode re-invokes the CLI itself, and the npm shim
      # would be recorded as `node tauri` which does not resolve from src-tauri/gen/apple.
      - name: Install Tauri CLI (cargo)
        run: cargo install tauri-cli --version "^2" --locked

      - name: Generate Xcode project (tauri ios init)
        run: |
          cargo tauri ios init --ci
          # Generate & sync all iOS App Icons into the newly generated Xcode project
          cargo tauri icon web/public/gradus21-app-icon.png --ios-color "#ffffff"
          for iconset in $(find src-tauri/gen/apple -name "AppIcon.appiconset" -type d); do
            echo "Syncing icons to $iconset"
            cp src-tauri/icons/ios/* "$iconset/" 2>/dev/null || true
          done
          # Embed ITSAppUsesNonExemptEncryption = false and NSFaceIDUsageDescription in Info.plist
          for plist in $(find src-tauri/gen/apple -name "Info.plist"); do
            echo "Setting ITSAppUsesNonExemptEncryption=false in $plist"
            /usr/libexec/PlistBuddy -c "Add :ITSAppUsesNonExemptEncryption bool false" "$plist" 2>/dev/null || \
            /usr/libexec/PlistBuddy -c "Set :ITSAppUsesNonExemptEncryption false" "$plist" 2>/dev/null || true
            echo "Setting NSFaceIDUsageDescription in $plist"
            /usr/libexec/PlistBuddy -c "Add :NSFaceIDUsageDescription string 'Gradus21 nutzt Face ID, um Ihren Noten-Tresor sicher und schnell zu entsperren.'" "$plist" 2>/dev/null || \
            /usr/libexec/PlistBuddy -c "Set :NSFaceIDUsageDescription 'Gradus21 nutzt Face ID, um Ihren Noten-Tresor sicher und schnell zu entsperren.'" "$plist" 2>/dev/null || true
            /usr/libexec/PlistBuddy -c "Add :UIFileSharingEnabled bool true" "$plist" 2>/dev/null || \
            /usr/libexec/PlistBuddy -c "Set :UIFileSharingEnabled true" "$plist" 2>/dev/null || true
            /usr/libexec/PlistBuddy -c "Add :LSSupportsOpeningDocumentsInPlace bool true" "$plist" 2>/dev/null || \
            /usr/libexec/PlistBuddy -c "Set :LSSupportsOpeningDocumentsInPlace true" "$plist" 2>/dev/null || true
          done
          # Configure Associated Domains (webcredentials:gradus21.app) for Passkey WebAuthn
          ENT_FILE="src-tauri/gen/apple/gradus21-app_iOS/gradus21-app_iOS.entitlements"
          mkdir -p "$(dirname "$ENT_FILE")"
          if [ ! -f "$ENT_FILE" ]; then
            echo "Creating initial $ENT_FILE"
            echo '<?xml version="1.0" encoding="UTF-8"?><!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd"><plist version="1.0"><dict></dict></plist>' > "$ENT_FILE"
          fi
          for ent in $(find src-tauri/gen/apple -name "*.entitlements"); do
            echo "Configuring associated-domains in $ent"
            /usr/libexec/PlistBuddy -c "Add :com.apple.developer.associated-domains array" "$ent" 2>/dev/null || true
            /usr/libexec/PlistBuddy -c "Add :com.apple.developer.associated-domains:0 string webcredentials:gradus21.app" "$ent" 2>/dev/null || \
            /usr/libexec/PlistBuddy -c "Set :com.apple.developer.associated-domains:0 webcredentials:gradus21.app" "$ent" 2>/dev/null || true
            echo "Resulting entitlements for $ent:"
            /usr/libexec/PlistBuddy -c "Print" "$ent" 2>/dev/null || true
          done

      - name: Build signed IPA
        env:
          APPLE_DEVELOPMENT_TEAM: 5X3CWU4583
          IOS_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE_P12 }}
          IOS_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          IOS_MOBILE_PROVISION: ${{ secrets.APPLE_PROVISIONING_PROFILE }}
        run: |
          # Frontend already built above; CFBundleVersion must grow with every upload.
          CONFIG='{"build":{"beforeBuildCommand":""},"bundle":{"iOS":{"bundleVersion":"'"$GITHUB_RUN_NUMBER"'"}}}'
          cargo tauri ios build --ci --export-method app-store-connect --config "$CONFIG"

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v6
        with:
          name: gradus21-ios-ipa
          path: src-tauri/gen/apple/build/**/*.ipa
          if-no-files-found: error

      - name: Upload to TestFlight
        env:
          KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          API_KEY_P8: ${{ secrets.APP_STORE_CONNECT_API_KEY_KEY }}
        run: |
          mkdir -p ~/.appstoreconnect/private_keys
          echo "$API_KEY_P8" > ~/.appstoreconnect/private_keys/AuthKey_${KEY_ID}.p8
          IPA=$(find src-tauri/gen/apple/build -name "*.ipa" | head -n 1)
          echo "Uploading $IPA"
          xcrun altool --upload-app -f "$IPA" -t ios --apiKey "$KEY_ID" --apiIssuer "$ISSUER_ID"

      - name: Clean up API key
        if: always()
        run: rm -rf ~/.appstoreconnect/private_keys
