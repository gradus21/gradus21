name: Desktop Multiplatform Release (Linux & Windows)

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build-linux:
    name: Build Linux Packages (.deb / AppImage)
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Install Linux GUI dependencies for Tauri
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libdbus-1-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            build-essential \
            curl \
            wget \
            file \
            libxdo-dev \
            libssl-dev

      - name: Set up Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2

      - name: Install wasm-pack
        run: curl https://rustwasm.github.io/wasm-pack/installer/init.sh -sSf | sh

      - name: Build Core WASM
        run: wasm-pack build crates/gradus21-core --target web --out-dir ../../web/src/wasm-pkg

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install Frontend Dependencies
        working-directory: web
        run: npm ci

      - name: Build Standalone Frontend Client
        working-directory: web
        env:
          VITE_STANDALONE_CLIENT: 'true'
        run: npm run build

      - name: Build Linux .deb and AppImage
        working-directory: web
        run: npx tauri build --bundles deb,appimage

      - name: Upload Linux Artifacts
        uses: actions/upload-artifact@v6
        with:
          name: gradus21-linux-packages
          path: |
            target/release/bundle/deb/*.deb
            target/release/bundle/appimage/*.AppImage
          if-no-files-found: warn

  build-windows:
    name: Build Windows Packages (.msi / .exe)
    runs-on: windows-latest
    timeout-minutes: 45

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2

      - name: Install wasm-pack
        run: cargo install wasm-pack

      - name: Build Core WASM
        run: wasm-pack build crates/gradus21-core --target web --out-dir ../../web/src/wasm-pkg

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install Frontend Dependencies
        working-directory: web
        run: npm ci

      - name: Build Standalone Frontend Client
        working-directory: web
        env:
          VITE_STANDALONE_CLIENT: 'true'
        run: npm run build

      - name: Build Windows Installer (.msi / .exe)
        working-directory: web
        run: npx tauri build --bundles msi,nsis

      - name: Upload Windows Artifacts
        uses: actions/upload-artifact@v6
        with:
          name: gradus21-windows-packages
          path: |
            target/release/bundle/msi/*.msi
            target/release/bundle/nsis/*.exe
          if-no-files-found: warn
