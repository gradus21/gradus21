name: Desktop Multiplatform Release (Linux & Windows)

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      target:
        description: 'Plattform-Ziel (all, windows, linux)'
        required: false
        default: 'all'
        type: choice
        options:
          - all
          - windows
          - linux

permissions:
  contents: write

jobs:
  build-linux:
    name: Build Linux Packages (.deb / AppImage)
    if: github.event_name != 'workflow_dispatch' || inputs.target == 'all' || inputs.target == 'linux'
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Install Linux GUI dependencies for Tauri
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libdbus-1-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            build-essential \
            curl \
            wget \
            file \
            libxdo-dev \
            libssl-dev

      - name: Set up Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2

      - name: Install wasm-pack
        run: curl https://rustwasm.github.io/wasm-pack/installer/init.sh -sSf | sh

      - name: Build Core WASM
        run: wasm-pack build crates/gradus21-core --target web --out-dir ../../web/src/wasm-pkg

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install Frontend Dependencies
        working-directory: web
        run: npm ci

      - name: Build Standalone Frontend Client
        working-directory: web
        env:
          VITE_STANDALONE_CLIENT: 'true'
        run: npm run build

      - name: Build Linux .deb and AppImage
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          OVERRIDE='{"build":{"beforeBuildCommand":""}}'
          ./web/node_modules/.bin/tauri build --config "$OVERRIDE" --bundles deb,appimage

      - name: Sign Linux Artifacts with GPG
        env:
          GPG_PRIVATE_KEY: ${{ secrets.GPG_PRIVATE_KEY }}
        run: |
          if [ -n "$GPG_PRIVATE_KEY" ]; then
            echo "$GPG_PRIVATE_KEY" | gpg --batch --import
            echo "Signing individual Linux packages with GPG..."
            for f in target/release/bundle/deb/*.deb target/release/bundle/appimage/*.AppImage; do
              if [ -f "$f" ]; then
                gpg --batch --yes --detach-sign --armor "$f"
              fi
            done
            echo "Generating and signing SHA256SUMS_linux.txt..."
            sha256sum target/release/bundle/deb/*.deb target/release/bundle/appimage/*.AppImage > SHA256SUMS_linux.txt
            gpg --batch --yes --detach-sign --armor SHA256SUMS_linux.txt
          fi

      - name: Upload Linux Artifacts
        uses: actions/upload-artifact@v6
        with:
          name: gradus21-linux-packages
          path: |
            target/release/bundle/deb/*.deb*
            target/release/bundle/appimage/*.AppImage*
            SHA256SUMS_linux.txt*
          if-no-files-found: warn

      - name: Attach Linux Artifacts to GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release upload "${{ github.ref_name }}" \
            target/release/bundle/deb/*.deb \
            target/release/bundle/deb/*.deb.asc \
            target/release/bundle/appimage/*.AppImage \
            target/release/bundle/appimage/*.AppImage.asc \
            SHA256SUMS_linux.txt* \
            --clobber || true

  build-windows:
    name: Build Windows Packages (.msi / .exe)
    if: github.event_name != 'workflow_dispatch' || inputs.target == 'all' || inputs.target == 'windows'
    runs-on: windows-latest
    timeout-minutes: 45

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2

      - name: Install wasm-pack
        run: cargo install wasm-pack

      - name: Build Core WASM
        run: wasm-pack build crates/gradus21-core --target web --out-dir ../../web/src/wasm-pkg

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install Frontend Dependencies
        working-directory: web
        run: npm ci

      - name: Build Standalone Frontend Client
        working-directory: web
        env:
          VITE_STANDALONE_CLIENT: 'true'
        run: npm run build

      - name: Build Windows Installer (.msi / .exe)
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        shell: bash
        run: |
          OVERRIDE='{"build":{"beforeBuildCommand":""}}'
          ./web/node_modules/.bin/tauri build --config "$OVERRIDE" --bundles msi,nsis

      - name: Build & Sign MSIX Package (Store / Sideloading)
        env:
          MSIX_PUBLISHER: ${{ secrets.MSIX_PUBLISHER || 'CN=9AFE237C-D8CE-415B-AEB5-ED30444929CC' }}
          MSIX_PACKAGE_NAME: ${{ vars.MSIX_PACKAGE_NAME || 'Gradus21.Gradus21' }}
          MSIX_PUBLISHER_DISPLAY_NAME: ${{ vars.MSIX_PUBLISHER_DISPLAY_NAME || 'Gradus21' }}
          WINDOWS_CERTIFICATE_PFX: ${{ secrets.WINDOWS_CERTIFICATE_PFX }}
          WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
        shell: powershell
        run: .\src-tauri\msix\package-msix.ps1

      - name: Publish to Microsoft Store
        env:
          MS_STORE_TENANT_ID: ${{ secrets.MS_STORE_TENANT_ID }}
          MS_STORE_CLIENT_ID: ${{ secrets.MS_STORE_CLIENT_ID }}
          MS_STORE_CLIENT_SECRET: ${{ secrets.MS_STORE_CLIENT_SECRET }}
          MS_STORE_SELLER_ID: ${{ secrets.MS_STORE_SELLER_ID }}
        shell: pwsh
        run: |
          if (-not $env:MS_STORE_TENANT_ID -or -not $env:MS_STORE_CLIENT_ID -or -not $env:MS_STORE_CLIENT_SECRET) {
            Write-Host "::notice::Microsoft Store API secrets (MS_STORE_TENANT_ID, MS_STORE_CLIENT_ID, MS_STORE_CLIENT_SECRET) not set. Skipping automated Store submission."
            exit 0
          }
          Write-Host "Installing Microsoft Store Developer CLI..."
          winget install --id "Microsoft.Store.CLI" --silent --accept-source-agreements --accept-package-agreements 2>$null
          if (-not (Get-Command "msstore" -ErrorAction SilentlyContinue)) {
            Write-Host "Fallback: Installing via dotnet tool..."
            dotnet tool install -g Microsoft.Store.CLI
          }
          Write-Host "Configuring Microsoft Store Developer CLI..."
          if ($env:MS_STORE_SELLER_ID) {
            msstore reconfigure --tenantId "$env:MS_STORE_TENANT_ID" --sellerId "$env:MS_STORE_SELLER_ID" --clientId "$env:MS_STORE_CLIENT_ID" --clientSecret "$env:MS_STORE_CLIENT_SECRET"
          } else {
            msstore reconfigure --tenantId "$env:MS_STORE_TENANT_ID" --clientId "$env:MS_STORE_CLIENT_ID" --clientSecret "$env:MS_STORE_CLIENT_SECRET"
          }
          Write-Host "Publishing MSIX package to Microsoft Store (Product ID: 9MTB3WRKMNDD)..."
          msstore publish target/release/bundle/msix -id 9MTB3WRKMNDD

      - name: Upload Windows Artifacts
        uses: actions/upload-artifact@v6
        with:
          name: gradus21-windows-packages
          path: |
            target/release/bundle/msi/*.msi*
            target/release/bundle/nsis/*.exe*
            target/release/bundle/nsis/*.zip*
            target/release/bundle/msix/*.msix*
            target/release/bundle/msix/*.cer*
          if-no-files-found: warn

      - name: Attach Windows Artifacts to GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          shopt -s nullglob
          artifacts=(target/release/bundle/msi/*.msi target/release/bundle/nsis/*.exe target/release/bundle/msix/*.msix target/release/bundle/msix/*.cer)
          if [ ${#artifacts[@]} -gt 0 ]; then
            echo "Uploading Windows artifacts to release ${{ github.ref_name }}..."
            gh release upload "${{ github.ref_name }}" "${artifacts[@]}" --clobber || true
          fi
