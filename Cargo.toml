[workspace]
resolver = "2"
members = [
    "crates/gradus21-core",
    "crates/gradus21-server",
]

[workspace.package]
version = "1.1.1"
edition = "2021"
license = "MIT"
authors = ["Julian Kallidat <julian.kallidat@campus.tu-berlin.de>"]

[workspace.dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "1.0"
uuid = { version = "1.10", features = ["v4", "v5", "serde", "js"] }
base64 = "0.22"
aes-gcm = "0.10"
argon2 = "0.5"
hkdf = "0.12"
sha2 = "0.10"
rand = "0.8"
getrandom = { version = "0.2", features = ["js"] }
zeroize = { version = "1.8", features = ["derive"] }
