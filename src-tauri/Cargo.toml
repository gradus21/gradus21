[package]
name = "gradus21-app"
version = "1.2.13"
description = "Gradus21 — Zero-Knowledge E2EE Notenverwaltung"
authors = ["Julian Kallidat <julian.kallidat@campus.tu-berlin.de>"]
edition = "2021"

[lib]
name = "gradus21_app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.0.0", features = [] }

[dependencies]
tauri = { version = "2.0.0", features = [] }
tauri-plugin-opener = "2.0.0"
tauri-plugin-biometric = "2.5.0"
serde = { workspace = true }
serde_json = { workspace = true }
gradus21-core = { path = "../crates/gradus21-core" }
rand = { workspace = true }

[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri-plugin-updater = "2.0.0"
keyring = "3"
